# RSS 数据源配置
# enabled: true 表示开启采集，false 表示跳过

sources:
  # ========== 综合技术 ==========
  - name: Hacker News Best (AI)
    url: https://hnrss.org/best?q=ai+OR+llm+OR+agent+OR+ml
    category: 综合技术
    enabled: false  # 量太大，默认关闭

  - name: Lobsters AI/ML
    url: https://lobste.rs/t/ai.rss
    category: 综合技术
    enabled: true

  # ========== AI 研究 ==========
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    category: AI 研究
    enabled: false  # 每日论文量大，默认关闭

  # ========== 公司博客 ==========
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    category: 公司博客
    enabled: true

  - name: Anthropic Research
    url: https://www.anthropic.com/research/feed
    category: 公司博客
    enabled: true

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    category: 公司博客
    enabled: true

  # ========== 中文社区 ==========
  - name: 机器之心
    url: https://www.jiqizhixin.com/rss
    category: 中文社区
    enabled: false  # 待确认 RSS 可用性

  - name: 量子位
    url: https://www.qbitai.com/feed
    category: 中文社区
    enabled: false  # 待确认 RSS 可用性

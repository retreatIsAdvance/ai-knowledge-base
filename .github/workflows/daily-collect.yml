name: Daily Collect

on:
  schedule:
    - cron: "0 8 * * *" # UTC 08:00 = 北京时间 16:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 1-2 Free Collect + Preprocess
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/pipeline.py --step 1 --step 2 --sources github,rss --limit 20 --verbose

      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/raw/
          if git diff --staged --quiet; then
            echo "没有新数据"
          else
            DATE=$(date +%Y-%m-%d)
            COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "raw: ${DATE} — ${COUNT} files"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Step 3-4 LLM Analyze + Save
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/pipeline.py --step 3 --step 4 --verbose

      - name: Validate JSON schemas
        run: python hooks/validate_json.py knowledge/articles/*.json

      - name: Check article quality
        run: python hooks/check_quality.py knowledge/articles/*.json

      - name: Commit articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/raw/ knowledge/articles/
          if git diff --staged --quiet; then
            echo "没有新文章"
          else
            DATE=$(date +%Y-%m-%d)
            COUNT=$(git diff --staged --name-only -- knowledge/articles/ | wc -l | tr -d ' ')
            git commit -m "articles: ${DATE} — ${COUNT} 篇文章"
            git pull --rebase origin main
            git push origin main
          fi
